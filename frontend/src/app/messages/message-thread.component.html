<section class="message-thread">
  <header class="thread-header">
    <h4>Messages</h4>
  </header>

  <div *ngIf="loading() && messages().length === 0" class="state">Loading messages...</div>
  <div *ngIf="error()" class="state error">{{ error() }}</div>

  <div class="message-list" #scrollContainer *ngIf="!error()">
    <div *ngIf="loading() && messages().length > 0" class="loading-pill">Loading newer messages...</div>
    <div *ngIf="!loading() && messages().length === 0" class="empty-state">No messages yet</div>

    <ng-container *ngFor="let m of messages(); let i = index">
      <div
        class="message-row"
        [class.mine]="isMine(m)"
        [class.first-in-group]="isFirstInGroup(i, m)"
        [style.marginTop.px]="gapFor(i, m)"
      >
        <div *ngIf="!isMine(m) && shouldShowSender(i, m)" class="sender-name" [style.color]="nameColor(m.senderId)">
          {{ m.senderUsername || 'User' }}
        </div>

        <div class="bubble" [class.mine]="isMine(m)">
          <div class="bubble-content">{{ m.content }}</div>
          <div class="time">{{ formatTime(m.createdAt) }}</div>
        </div>
      </div>
    </ng-container>
  </div>

  <form class="composer" (ngSubmit)="send()">
    <div class="composer-bar">
      <input
        name="content"
        placeholder="Message"
        [ngModel]="newMessage()"
        (ngModelChange)="newMessage.set($event)"
        autocomplete="off"
      />
      <button type="submit" class="send-btn" [disabled]="sending() || newMessage().trim().length === 0">
        <span class="send-icon">➤</span>
      </button>
    </div>
  </form>
</section>

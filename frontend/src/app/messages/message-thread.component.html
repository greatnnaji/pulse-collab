<section class="message-thread">
  <header class="thread-header">
    <h4>Messages</h4>
  </header>

  <div *ngIf="loading()" class="state">Loading messages...</div>
  <div *ngIf="error()" class="state error">{{ error() }}</div>

  <ul class="message-list" *ngIf="!loading() && !error() && messages().length > 0">
    <li *ngFor="let m of messages(); let i = index" class="message-item">
      <div class="meta">{{ m.senderUsername || 'User' }} • {{ m.createdAt }}</div>
      <div class="content">{{ m.content }}</div>
    </li>
  </ul>

  <div *ngIf="!loading() && !error() && messages().length === 0" class="empty-state">
    No messages yet
  </div>
</section>

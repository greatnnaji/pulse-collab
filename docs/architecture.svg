<svg width="100%" viewBox="0 0 680 660" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family: ui-sans-serif, system-ui, sans-serif;">
  <title>Pulse Collab — Architecture Diagram</title>
  <desc>High-level architecture showing Angular client, Spring Security with JWT filter, controller layer, service layer, repository layer, PostgreSQL, and planned AI and n8n layers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="660" rx="12" fill="#0d1117"/>

  <!-- ── ANGULAR CLIENT ── -->
  <rect x="140" y="20" width="400" height="64" rx="10" fill="#26215C" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="44" text-anchor="middle" dominant-baseline="central" fill="#CECBF6" font-size="14" font-weight="500">Angular client</text>
  <text x="340" y="62" text-anchor="middle" dominant-baseline="central" fill="#7F77DD" font-size="12">TypeScript · SCSS · HTTP/JSON · WebSocket</text>

  <!-- ↓ -->
  <line x1="340" y1="84" x2="340" y2="110" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── SPRING SECURITY ── -->
  <rect x="80" y="112" width="520" height="88" rx="10" fill="#0a1628" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="135" text-anchor="middle" dominant-baseline="central" fill="#85B7EB" font-size="14" font-weight="500">Spring Security</text>

  <!-- JWT filter box -->
  <rect x="100" y="148" width="220" height="40" rx="6" fill="#0c1f3a" stroke="#185FA5" stroke-width="0.5"/>
  <text x="210" y="168" text-anchor="middle" dominant-baseline="central" fill="#B5D4F4" font-size="12">JwtAuthenticationFilter</text>

  <!-- CORS box -->
  <rect x="340" y="148" width="240" height="40" rx="6" fill="#0c1f3a" stroke="#185FA5" stroke-width="0.5"/>
  <text x="460" y="168" text-anchor="middle" dominant-baseline="central" fill="#B5D4F4" font-size="12">CORS config · SecurityContext</text>

  <!-- ↓ -->
  <line x1="340" y1="200" x2="340" y2="226" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── CONTROLLER LAYER ── -->
  <rect x="80" y="228" width="520" height="96" rx="10" fill="#04342C" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="251" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB" font-size="14" font-weight="500">Controller layer</text>

  <!-- AuthController -->
  <rect x="100" y="264" width="148" height="44" rx="6" fill="#083828" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="174" y="282" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB" font-size="13" font-weight="500">AuthController</text>
  <text x="174" y="298" text-anchor="middle" dominant-baseline="central" fill="#1D9E75" font-size="11">/api/auth/*</text>

  <!-- GroupController -->
  <rect x="266" y="264" width="156" height="44" rx="6" fill="#083828" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="344" y="282" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB" font-size="13" font-weight="500">GroupController</text>
  <text x="344" y="298" text-anchor="middle" dominant-baseline="central" fill="#1D9E75" font-size="11">/api/groups/*</text>

  <!-- MessageController (WS) -->
  <rect x="440" y="264" width="148" height="44" rx="6" fill="#083828" stroke="#185FA5" stroke-width="0.5"/>
  <text x="514" y="282" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB" font-size="13" font-weight="500">MessageController</text>
  <text x="514" y="298" text-anchor="middle" dominant-baseline="central" fill="#85B7EB" font-size="11">/ws  · STOMP</text>

  <!-- ↓ -->
  <line x1="340" y1="324" x2="340" y2="350" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── SERVICE LAYER ── -->
  <rect x="80" y="352" width="520" height="96" rx="10" fill="#04342C" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="375" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB" font-size="14" font-weight="500">Service layer</text>

  <!-- AuthService -->
  <rect x="100" y="388" width="120" height="44" rx="6" fill="#083828" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="160" y="406" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB" font-size="13" font-weight="500">AuthService</text>
  <text x="160" y="422" text-anchor="middle" dominant-baseline="central" fill="#1D9E75" font-size="11">register · login</text>

  <!-- GroupService -->
  <rect x="236" y="388" width="120" height="44" rx="6" fill="#083828" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="296" y="406" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB" font-size="13" font-weight="500">GroupService</text>
  <text x="296" y="422" text-anchor="middle" dominant-baseline="central" fill="#1D9E75" font-size="11">create · getAll</text>

  <!-- JwtService -->
  <rect x="372" y="388" width="100" height="44" rx="6" fill="#083828" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="422" y="406" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB" font-size="13" font-weight="500">JwtService</text>
  <text x="422" y="422" text-anchor="middle" dominant-baseline="central" fill="#1D9E75" font-size="11">sign · validate</text>

  <!-- MessageService -->
  <rect x="488" y="388" width="100" height="44" rx="6" fill="#083828" stroke="#185FA5" stroke-width="0.5"/>
  <text x="538" y="406" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB" font-size="13" font-weight="500">MessageService</text>
  <text x="538" y="422" text-anchor="middle" dominant-baseline="central" fill="#85B7EB" font-size="11">send · history</text>

  <!-- ↓ -->
  <line x1="340" y1="448" x2="340" y2="474" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── REPOSITORY LAYER ── -->
  <rect x="80" y="476" width="520" height="80" rx="10" fill="#1a1200" stroke="#854F0B" stroke-width="0.5"/>
  <text x="340" y="499" text-anchor="middle" dominant-baseline="central" fill="#FAC775" font-size="14" font-weight="500">Repository layer  ·  Spring Data JPA</text>

  <rect x="100" y="514" width="126" height="30" rx="6" fill="#412402" stroke="#854F0B" stroke-width="0.5"/>
  <text x="163" y="529" text-anchor="middle" dominant-baseline="central" fill="#FAC775" font-size="12">UserRepository</text>

  <rect x="246" y="514" width="136" height="30" rx="6" fill="#412402" stroke="#854F0B" stroke-width="0.5"/>
  <text x="314" y="529" text-anchor="middle" dominant-baseline="central" fill="#FAC775" font-size="12">GroupRepository</text>

  <rect x="402" y="514" width="178" height="30" rx="6" fill="#412402" stroke="#854F0B" stroke-width="0.5"/>
  <text x="491" y="529" text-anchor="middle" dominant-baseline="central" fill="#FAC775" font-size="12">GroupMemberRepository</text>

  <!-- ↓ -->
  <line x1="340" y1="556" x2="340" y2="578" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── POSTGRESQL ── -->
  <rect x="200" y="580" width="280" height="52" rx="10" fill="#412402" stroke="#854F0B" stroke-width="0.8"/>
  <text x="340" y="600" text-anchor="middle" dominant-baseline="central" fill="#FAC775" font-size="14" font-weight="500">PostgreSQL</text>
  <text x="340" y="618" text-anchor="middle" dominant-baseline="central" fill="#BA7517" font-size="12">users · groups · messages · members</text>

  <!-- ── PLANNED: AI + n8n (right side) ── -->
  <rect x="596" y="352" width="68" height="44" rx="8" fill="#1a1a2e" stroke="#534AB7" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="630" y="370" text-anchor="middle" dominant-baseline="central" fill="#AFA9EC" font-size="12" font-weight="500">AI service</text>
  <text x="630" y="385" text-anchor="middle" dominant-baseline="central" fill="#7F77DD" font-size="11">planned</text>

  <rect x="596" y="420" width="68" height="44" rx="8" fill="#1a0800" stroke="#993C1D" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="630" y="438" text-anchor="middle" dominant-baseline="central" fill="#F5C4B3" font-size="12" font-weight="500">n8n</text>
  <text x="630" y="453" text-anchor="middle" dominant-baseline="central" fill="#993C1D" font-size="11">planned</text>

  <!-- MessageService → AI -->
  <line x1="588" y1="406" x2="596" y2="374" stroke="#534AB7" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <!-- AI → n8n -->
  <line x1="630" y1="396" x2="630" y2="418" stroke="#534AB7" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- ── LEGEND ── -->
  <line x1="180" y1="644" x2="202" y2="644" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="208" y="644" dominant-baseline="central" fill="#8b949e" font-size="12">HTTP / REST</text>

  <line x1="308" y1="644" x2="330" y2="644" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="336" y="644" dominant-baseline="central" fill="#8b949e" font-size="12">WebSocket</text>

  <line x1="416" y1="644" x2="438" y2="644" stroke="#534AB7" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="444" y="644" dominant-baseline="central" fill="#8b949e" font-size="12">Planned</text>

</svg>
